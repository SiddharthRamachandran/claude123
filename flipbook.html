<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Chase Flipbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..700;1,300..700&display=swap">
<style>
/* ---- a sketchbook on a dark desk. one committed look, painted explicitly. ---- */
:root{
  --desk:#23241f;
  --desk-lit:#33342c;
  --paper:#efece2;
  --paper-edge:#ddd8c9;
  --paper-deep:#c9c3b0;
  --graphite:#2f2e2a;
  --graphite-mid:#55534c;
  --graphite-soft:#8d8b81;
  --caption:#807f73;
  --hand:"Shantell Sans","Segoe Print","Bradley Hand",cursive;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--desk);
  background-image:radial-gradient(120% 90% at 50% 42%, var(--desk-lit) 0%, var(--desk) 62%);
  color:var(--paper);
  font-family:var(--hand);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(14px,3vw,26px);
  padding:clamp(16px,4vw,40px);
  overflow-x:hidden;
}

/* ---- the book ---- */
.book{
  position:relative;
  width:min(94vw, 880px);
  transform:rotate(-1.1deg);
  filter:drop-shadow(0 26px 34px rgba(0,0,0,.55)) drop-shadow(0 3px 6px rgba(0,0,0,.4));
}
.leaf{
  position:relative;
  display:flex;
  align-items:stretch;
  background:var(--paper);
  border-radius:2px 5px 5px 2px;
}
/* stitched binding down the left */
.spine{
  flex:0 0 clamp(16px,2.4vw,24px);
  position:relative;
  background:linear-gradient(90deg, var(--paper-deep) 0%, var(--paper-edge) 46%, var(--paper) 100%);
  border-radius:2px 0 0 2px;
}
.spine::after{ /* thread */
  content:"";
  position:absolute; inset:7% 0 7% 42%;
  width:2px;
  background:repeating-linear-gradient(180deg, var(--graphite-mid) 0 9px, transparent 9px 19px);
  opacity:.5;
}
/* the pages already flipped (grows) and the ones still to come (thins) */
.stack{
  flex:0 0 auto;
  background-repeat:repeat-x;
  transition:none;
}
.stack-left{
  width:6px;
  background-image:repeating-linear-gradient(90deg, var(--paper-deep) 0 1px, var(--paper) 1px 3px);
  box-shadow:inset -3px 0 5px -3px rgba(80,74,58,.5);
}
.stack-right{
  width:52px;
  background-image:repeating-linear-gradient(90deg, var(--paper) 0 2px, var(--paper-edge) 2px 3px);
  box-shadow:inset 5px 0 8px -5px rgba(80,74,58,.55);
  border-radius:0 4px 4px 0;
}
/* the live page */
.page{
  position:relative;
  flex:1 1 auto;
  min-width:0;
  aspect-ratio:720/480;
  overflow:hidden;
  background:var(--paper);
}
.page-inner{position:absolute; inset:0; will-change:transform}
.page svg.art{display:block; width:100%; height:100%}
.grain{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:multiply; opacity:.5}
.sweep{
  position:absolute; inset:0; pointer-events:none; opacity:0;
  background:linear-gradient(100deg, transparent 34%, rgba(96,88,66,.30) 48%, rgba(96,88,66,.06) 56%, transparent 66%);
}
.folio{
  position:absolute; right:2.6%; bottom:2.4%;
  font-family:var(--hand); font-size:clamp(11px,1.5vw,16px); font-weight:500;
  color:var(--graphite-soft);
  font-variant-numeric:tabular-nums;
  transform:rotate(1.6deg);
}
/* book thickness under the leaf */
.book::after{
  content:"";
  position:absolute; left:1.2%; right:.4%; top:100%; height:9px;
  background:repeating-linear-gradient(180deg, var(--paper-edge) 0 1px, var(--paper-deep) 1px 2px);
  border-radius:0 0 4px 5px;
  transform:skewX(-38deg) translateX(3px);
  transform-origin:top left;
  opacity:.85;
}
.caption{
  margin:0;
  font-size:clamp(12px,1.6vw,15px);
  font-style:italic; font-weight:300;
  color:var(--caption);
  text-align:center; text-wrap:balance;
  max-width:34ch; line-height:1.5;
}
@media (max-width:520px){ .stack-right{width:34px} }
</style>
</head>
<body>

<div class="book">
  <div class="leaf">
    <div class="spine"></div>
    <div class="stack stack-left" id="stackL"></div>
    <div class="page">
      <div class="page-inner" id="pageInner">
        <svg class="art" id="art" viewBox="0 0 720 480" aria-label="A pencil drawing of a cat chasing a mouse, with a car far away in the background."></svg>
        <div class="folio" id="folio">1</div>
      </div>
      <svg class="grain" aria-hidden="true">
        <filter id="grain-f"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
        <rect width="100%" height="100%" filter="url(#grain-f)" opacity="0.22"/>
      </svg>
      <div class="sweep" id="sweep"></div>
    </div>
    <div class="stack stack-right" id="stackR"></div>
  </div>
</div>

<p class="caption">Thirty pages, thumbed end to end. He never quite gets him.</p>

<script>
(function(){
  "use strict";

  /* ============ page geometry ============ */
  var W = 720, H = 480;
  var GROUND = 404;          // the line the chase runs on
  var ROAD   = 258;          // the far-away road the car uses
  var FRAMES = 30;

  var DARK  = "#2f2e2a";
  var MID   = "#55534c";
  var SOFT  = "#8d8b81";
  var FAINT = "#aca99d";
  var PAPER = "#efece2";

  /* ============ pencil primitives ============ */
  // deterministic per frame, different every frame -> the "boiling line" of a real flipbook
  var rnd = mk(1);
  function mk(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hash(n){ var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
  function f(n){ return Math.round(n * 10) / 10; }

  function jit(pts, amp){
    var out = [], i;
    for(i = 0; i < pts.length; i++){
      out.push([pts[i][0] + (rnd() * 2 - 1) * amp, pts[i][1] + (rnd() * 2 - 1) * amp]);
    }
    return out;
  }

  // smooth a point list into a path; a hand draws through points, it doesn't hit them
  function toPath(pts, closed){
    var p = closed ? pts.concat([pts[0], pts[1]]) : pts, d, i, mx, my, n;
    if(p.length < 2) return "";
    if(closed){
      d = "M" + f((p[0][0] + p[1][0]) / 2) + " " + f((p[0][1] + p[1][1]) / 2);
    } else {
      d = "M" + f(p[0][0]) + " " + f(p[0][1]);
    }
    for(i = 1; i < p.length - 1; i++){
      mx = (p[i][0] + p[i + 1][0]) / 2;
      my = (p[i][1] + p[i + 1][1]) / 2;
      d += "Q" + f(p[i][0]) + " " + f(p[i][1]) + " " + f(mx) + " " + f(my);
    }
    if(closed){ d += "Z"; }
    else { n = p.length; d += "L" + f(p[n - 1][0]) + " " + f(p[n - 1][1]); }
    return d;
  }

  // two or three passes at slightly different jitter = graphite laid down by hand
  function ink(pts, o){
    o = o || {};
    var amp    = o.amp    === undefined ? 1.3  : o.amp,
        w      = o.w      === undefined ? 2.2  : o.w,
        passes = o.passes === undefined ? 2    : o.passes,
        alpha  = o.alpha  === undefined ? 0.92 : o.alpha,
        col    = o.col    || DARK,
        fill   = o.fill   || "none",
        closed = !!o.closed,
        s = "", k, ww, aa;
    for(k = 0; k < passes; k++){
      ww = (w * (k === 0 ? 1 : 0.68 - k * 0.12)).toFixed(2);
      aa = (alpha * (k === 0 ? 1 : 0.40 - k * 0.10)).toFixed(2);
      s += '<path d="' + toPath(jit(pts, amp), closed) + '" fill="' + (k === 0 ? fill : "none") +
           '" stroke="' + col + '" stroke-width="' + ww + '" stroke-opacity="' + aa +
           '" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    return s;
  }

  function blob(cx, cy, r, squash, amp, o){
    var pts = [], i, a, rr;
    for(i = 0; i < 9; i++){
      a = i / 9 * Math.PI * 2;
      rr = r * (0.94 + rnd() * 0.12);
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * squash]);
    }
    o = o || {}; o.closed = true;
    return ink(pts, o);
  }

  // short slanted strokes: shading, dirt, the underside of things
  function hatch(x, y, w, h, n, lean, o){
    var s = "", i, hx, hy, len;
    o = o || {};
    for(i = 0; i < n; i++){
      hx = x + rnd() * w; hy = y + rnd() * h; len = 5 + rnd() * 7;
      s += ink([[hx, hy], [hx + lean * len, hy + len * 0.5]],
               { w: o.w || 1.3, amp: 0.7, passes: 1, col: o.col || SOFT, alpha: o.alpha || 0.55 });
    }
    return s;
  }

  /* ============ the world, back to front ============ */

  function clouds(scroll){
    var s = "", spacing = 290, off = ((scroll % spacing) + spacing) % spacing, x, k, cy, r;
    for(x = -spacing - off; x < W + spacing; x += spacing){
      k = Math.round((x + scroll) / spacing);
      cy = 70 + hash(k) * 70;
      r  = 22 + hash(k + 9) * 16;
      s += ink([[x - r * 1.7, cy + r * 0.5], [x - r * 1.3, cy - r * 0.3], [x - r * 0.4, cy - r * 0.85],
                [x + r * 0.5, cy - r * 0.6], [x + r * 1.4, cy - r * 0.1], [x + r * 1.8, cy + r * 0.5]],
               { w: 1.5, amp: 1.5, col: FAINT, alpha: 0.8 });
    }
    return s;
  }

  // the sun stays put in the corner, the way it does in every kid's drawing
  function sun(t){
    var cx = 622, cy = 78, s = "", i, a, wob = Math.sin(t * Math.PI * 2) * 1.5;
    s += blob(cx, cy, 26, 1, 1.7, { w: 1.7, col: FAINT, alpha: 0.9 });
    for(i = 0; i < 9; i++){
      a = i / 9 * Math.PI * 2 + wob * 0.03;
      s += ink([[cx + Math.cos(a) * 33, cy + Math.sin(a) * 33],
                [cx + Math.cos(a) * (44 + (i % 2) * 5), cy + Math.sin(a) * (44 + (i % 2) * 5)]],
               { w: 1.4, amp: 1.1, passes: 1, col: FAINT, alpha: 0.75 });
    }
    return s;
  }

  // two birds, the classic pair of ticks
  function birds(scroll){
    var s = "", spacing = 420, off = ((scroll % spacing) + spacing) % spacing, x, k, cy, sz, flap;
    for(x = -spacing - off; x < W + spacing; x += spacing){
      k = Math.round((x + scroll) / spacing);
      cy = 96 + hash(k + 11) * 46;
      sz = 8 + hash(k + 13) * 4;
      flap = Math.sin(scroll / 9 + k) * 3;
      s += ink([[x - sz, cy], [x, cy - sz * 0.55 - flap], [x + sz, cy]], { w: 1.4, amp: 0.9, passes: 1, col: SOFT, alpha: 0.85 });
      s += ink([[x + sz * 1.6, cy + 12], [x + sz * 2.6, cy + 12 - sz * 0.5 + flap], [x + sz * 3.6, cy + 12]],
               { w: 1.3, amp: 0.9, passes: 1, col: SOFT, alpha: 0.75 });
    }
    return s;
  }

  function hills(scroll){
    var pts = [], x, y;
    for(x = -60; x <= W + 60; x += 36){
      y = 216 - 26 * Math.sin((x + scroll) / 118) - 11 * Math.sin((x + scroll) / 51 + 1.7);
      pts.push([x, y]);
    }
    return ink(pts, { w: 1.6, amp: 1.4, col: FAINT, alpha: 0.85, passes: 2 });
  }

  function road(scroll){
    var s = "", spacing = 62, off = ((scroll % spacing) + spacing) % spacing, x;
    s += ink([[-20, ROAD + 4], [W * 0.35, ROAD - 1], [W * 0.72, ROAD + 2], [W + 20, ROAD - 2]],
             { w: 1.5, amp: 1.2, col: FAINT, alpha: 0.75 });
    for(x = -off; x < W + spacing; x += spacing){   // dashes down the middle
      s += ink([[x, ROAD - 5], [x + 20, ROAD - 6]], { w: 1.2, amp: 0.8, passes: 1, col: FAINT, alpha: 0.5 });
    }
    return s;
  }

  // the car: tiny, far off, crossing the whole book from first page to last
  function car(t){
    var x = W + 78 - t * (W + 190), y = ROAD - 10, s = "";
    s += ink([[x - 28, y], [x - 24, y - 9], [x - 6, y - 11], [x + 8, y - 11],
              [x + 24, y - 7], [x + 28, y], [x + 20, y + 4], [x - 20, y + 4]],
             { w: 1.5, amp: 1.0, col: SOFT, alpha: 0.85, closed: true, fill: PAPER });
    s += ink([[x - 12, y - 11], [x - 8, y - 21], [x + 6, y - 21], [x + 13, y - 11]],
             { w: 1.4, amp: 0.9, col: SOFT, alpha: 0.8 });                       // cabin
    s += ink([[x - 1, y - 20], [x - 1, y - 11]], { w: 1.1, amp: 0.6, passes: 1, col: FAINT }); // door post
    s += blob(x - 15, y + 5, 4.5, 1, 0.9, { w: 1.4, col: SOFT, alpha: 0.85, passes: 1 });
    s += blob(x + 15, y + 5, 4.5, 1, 0.9, { w: 1.4, col: SOFT, alpha: 0.85, passes: 1 });
    s += ink([[x + 34, y - 8], [x + 52, y - 8]], { w: 1.1, amp: 0.9, passes: 1, col: FAINT, alpha: 0.55 });
    s += ink([[x + 36, y - 1], [x + 60, y - 1]], { w: 1.1, amp: 0.9, passes: 1, col: FAINT, alpha: 0.45 });
    return s;
  }

  function midground(scroll){
    var s = "", spacing = 300, off = ((scroll % spacing) + spacing) % spacing, x, k, base, h, i, fx;
    for(x = -spacing - off; x < W + spacing; x += spacing){
      k = Math.round((x + scroll) / spacing);
      base = 342 + hash(k + 3) * 8;
      if(hash(k) > 0.45){                                   // a scrubby tree
        h = 44 + hash(k + 5) * 22;
        s += ink([[x, base], [x + 2, base - h * 0.6], [x - 1, base - h]], { w: 1.9, amp: 1.2, col: SOFT });
        s += blob(x, base - h - 10, 15 + hash(k + 7) * 6, 0.78, 2.3, { w: 1.5, col: SOFT, alpha: 0.8, fill: PAPER });
        s += ink([[x - 1, base - h * 0.72], [x - 15, base - h * 0.94]], { w: 1.4, amp: 1, passes: 1, col: SOFT });
      } else {                                              // a bit of fence
        for(i = 0; i < 4; i++){
          fx = x + i * 22;
          s += ink([[fx, base], [fx + 1, base - 26]], { w: 1.5, amp: 1, passes: 1, col: SOFT, alpha: 0.7 });
        }
        s += ink([[x - 4, base - 18], [x + 72, base - 20]], { w: 1.3, amp: 1.1, passes: 1, col: SOFT, alpha: 0.7 });
      }
    }
    return s;
  }

  function ground(scroll){
    var s = "", pts = [], x, spacing = 210, off, k, gx, gh;
    for(x = -40; x <= W + 40; x += 44){ pts.push([x, GROUND + Math.sin((x + scroll) / 90) * 2.5]); }
    s += ink(pts, { w: 2.4, amp: 1.4 });
    s += hatch(-10, GROUND + 6, W + 20, 32, 40, 0.9, { col: SOFT, alpha: 0.4 });
    for(x = 0; x < 8; x++){
      k = x * 163;
      gx = ((((-scroll * 1.25 + k) % (W + 300)) + (W + 300)) % (W + 300)) - 150;
      gh = GROUND + 9 + hash(x + 31) * 24;
      s += ink([[gx, gh], [gx + 46 + hash(x + 41) * 54, gh]],
               { w: 1.3, amp: 0.6, passes: 1, col: SOFT, alpha: 0.55 });
    }
    off = ((scroll % spacing) + spacing) % spacing;
    for(x = -spacing - off; x < W + spacing; x += spacing){   // grass whipping past
      k = Math.round((x + scroll) / spacing);
      gx = x; gh = 10 + hash(k) * 12;
      s += ink([[gx - 5, GROUND + 2], [gx - 2, GROUND - gh * 0.8]], { w: 1.5, amp: 0.9, passes: 1, col: MID });
      s += ink([[gx, GROUND + 2], [gx + 2, GROUND - gh]], { w: 1.5, amp: 0.9, passes: 1, col: MID });
      s += ink([[gx + 5, GROUND + 2], [gx + 9, GROUND - gh * 0.7]], { w: 1.5, amp: 0.9, passes: 1, col: MID });
    }
    return s;
  }

  /* ============ the chase ============ */

  // hip -> knee -> paw, foot tracing an ellipse: on the ground half the cycle, lifted the other half
  function leg(hx, hy, th, reach, lift, kneeLean, col, wide, bias){
    var fx = hx + (bias || 0) + Math.cos(th) * reach,
        fy = GROUND - Math.max(0, Math.sin(th)) * lift,
        mx = (hx + fx) / 2 + kneeLean, my = (hy + fy) / 2 + 3;
    return ink([[hx, hy], [mx, my], [fx, fy]], { w: wide, amp: 1.0, col: col }) +
           ink([[fx - 3.5, fy], [fx + 4, fy + 0.5]], { w: wide + 0.4, amp: 0.6, passes: 1, col: col });
  }

  function cat(x, ph, reach){
    reach = reach || 0;
    var bob  = Math.sin(ph * Math.PI * 4) * 3.6 * (1 - reach * 0.6),
        by   = GROUND - 58 + bob + reach * 7,      // he flattens out as he lunges
        tw   = Math.sin(ph * Math.PI * 2 + 1.2),
        lunge = reach > 0.4 || Math.sin(ph * Math.PI * 2) > 0.55,
        s = "", hx = x + 64 + reach * 10, hy = by - 20 - reach * 3, i, a;

    var th = ph * Math.PI * 2;
    // tail, whipping behind
    s += ink([[x - 60, by - 2], [x - 86, by - 16 - tw * 10], [x - 108, by - 34 - tw * 16], [x - 114, by - 56 - tw * 10]],
             { w: 2.6, amp: 1.5 });
    // far legs first, lighter, so they sit behind the body. a gallop: hinds together, then fronts
    s += leg(x - 36, by + 12, th + 0.35 * Math.PI, 11, 13, -6, MID, 2.0, -8);
    s += leg(x + 26, by + 13, th + 1.25 * Math.PI, 11, 12,  6, MID, 2.0, 8 + reach * 14);

    // body
    s += ink([[x - 62, by + 2], [x - 56, by - 18], [x - 30, by - 27], [x + 6, by - 29],
              [x + 34, by - 23], [x + 48, by - 9], [x + 46, by + 10], [x + 16, by + 19],
              [x - 20, by + 21], [x - 50, by + 16]],
             { w: 2.5, amp: 0.9, closed: true, fill: PAPER });
    // stripes over the back
    for(i = 0; i < 3; i++){
      a = x - 22 + i * 19;
      s += ink([[a, by - 26], [a + 5, by - 16]], { w: 1.8, amp: 0.9, passes: 1, col: MID });
    }
    s += hatch(x - 40, by + 6, 74, 12, 7, 0.9, { col: SOFT, alpha: 0.5 });

    // near legs
    s += leg(x - 44, by + 11, th,             13, 15, -7, DARK, 2.5, -10);
    s += leg(x + 34, by + 12, th + Math.PI,   13, 14,  7, DARK, 2.5, 10 + reach * 24);

    // head, ears pinned back, eyes wide
    s += blob(hx, hy, 21, 0.95, 0.9, { w: 2.4, fill: PAPER });
    s += ink([[hx - 16, hy - 12], [hx - 22, hy - 30], [hx - 2, hy - 20]], { w: 2.1, amp: 1.2, closed: true, fill: PAPER });
    s += ink([[hx + 4, hy - 20], [hx + 6, hy - 34], [hx + 18, hy - 15]], { w: 2.1, amp: 1.2, closed: true, fill: PAPER });
    s += blob(hx + 7, hy - 5, 5.2, 1.05, 0.8, { w: 1.9, passes: 1 });                       // eye
    s += blob(hx + 8.5, hy - 4, 2.1, 1, 0.5, { w: 2.4, passes: 1, fill: DARK });            // pupil
    s += blob(hx + 17, hy + 4, 3.2, 0.8, 0.6, { w: 2, passes: 1, fill: DARK });             // nose
    if(lunge){                                                                              // mouth open on the lunge
      s += ink([[hx + 12, hy + 9], [hx + 17, hy + 16], [hx + 22, hy + 8]], { w: 1.9, amp: 1, closed: true });
    } else {
      s += ink([[hx + 11, hy + 9], [hx + 16, hy + 12], [hx + 21, hy + 8]], { w: 1.8, amp: 1, passes: 1 });
    }
    for(i = 0; i < 3; i++){                                                                 // whiskers
      s += ink([[hx + 16, hy + 3], [hx + 38, hy - 4 + i * 8]], { w: 1.2, amp: 1.1, passes: 1, col: MID, alpha: 0.8 });
    }
    return s;
  }

  function mouse(x, ph, glance){
    var bob = Math.sin(ph * Math.PI * 4) * 2.2,
        by  = GROUND - 27 + bob,
        tw  = Math.sin(ph * Math.PI * 2 + 0.6),
        s = "", i, lx;

    // tail, streaming out behind with a flick at the tip
    s += ink([[x - 22, by - 1], [x - 42, by - 6 - tw * 6], [x - 62, by + 2], [x - 74, by - 6 - tw * 8]],
             { w: 1.7, amp: 1.2, col: MID });
    // legs, more of a scribble than a stride at this speed
    for(i = 0; i < 4; i++){
      lx = x - 15 + i * 11;
      s += ink([[lx, by + 6], [lx + Math.cos(ph * Math.PI * 2 + i * 1.6) * 6, GROUND]],
               { w: 1.5, amp: 1.1, passes: 1, col: (i % 2) ? MID : DARK });
    }
    // body + head in one gesture
    s += ink([[x - 24, by + 2], [x - 19, by - 9], [x - 3, by - 13], [x + 13, by - 11],
              [x + 25, by - 3], [x + 20, by + 8], [x - 6, by + 11], [x - 20, by + 9]],
             { w: 2.1, amp: 0.8, closed: true, fill: PAPER });
    s += blob(x + 4, by - 14, 7, 0.95, 1.1, { w: 1.8, fill: PAPER, passes: 1 });   // ear
    s += blob(x + 17, by - 5, 1.9, 1, 0.5, { w: 2.1, passes: 1, fill: DARK });     // eye
    s += ink([[x + 24, by - 2], [x + 31, by + 1]], { w: 1.6, amp: 0.8, passes: 1 });// nose
    for(i = 0; i < 2; i++){
      s += ink([[x + 27, by], [x + 40, by - 4 + i * 7]], { w: 1.1, amp: 1, passes: 1, col: MID, alpha: 0.75 });
    }
    if(glance){                                                                    // an alarmed "!"
      s += ink([[x + 8, by - 32], [x + 10, by - 24]], { w: 2.2, amp: 0.8, passes: 1 });
      s += ink([[x + 10.5, by - 20], [x + 11, by - 19]], { w: 2.6, amp: 0.4, passes: 1 });
    }
    return s;
  }

  function speedLines(x, y, n, len, spread){
    var s = "", i;
    for(i = 0; i < n; i++){
      s += ink([[x, y + i * spread], [x - len - rnd() * 14, y + i * spread + (rnd() * 4 - 2)]],
               { w: 1.4, amp: 1.1, passes: 1, col: SOFT, alpha: 0.7 });
    }
    return s;
  }

  function dust(x, ph){
    var s = "", i, d, r;
    for(i = 0; i < 3; i++){
      d = ((ph * 2 + i / 3) % 1);
      r = 3.5 + d * 11;
      s += blob(x - 62 - d * 74, GROUND - 10 - d * 26, r, 0.75, 1.8,
                { w: 1.2, passes: 1, col: FAINT, alpha: 0.8 * (1 - d) });
    }
    return s;
  }

  /* ============ one page ============ */
  function frame(i){
    rnd = mk(1013 + i * 977);
    var t = i / FRAMES,
        ph = t * 5,                                   // five strides across the book
        // the cat closes the whole way through the book instead of bobbing in place:
        // a sine gap ends where it started, so the chase went nowhere.
        e = t < 0.88 ? t / 0.88 : 1,
        close = e * e * (3 - 2 * e),                  // slow at first, then a rush
        gap = 430 - 260 * close,                      // 430px apart down to 170px
        burst = t > 0.88 ? (t - 0.88) / 0.12 : 0,     // the mouse's last-second escape
        mouseX = 486 + burst * 70,
        catX = mouseX - gap - burst * 35,
        s = "";

    s += sun(t);
    s += clouds(-t * 150);
    s += birds(-t * 300);
    s += hills(-t * 400);
    s += road(-t * 460);
    s += car(t);
    s += midground(-t * 900);
    s += ground(-t * 1500);
    s += speedLines(catX - 112, GROUND - 84, 4, 30 + close * 46, 15);
    s += speedLines(mouseX - 40, GROUND - 34, 3, 22 + close * 30, 11);
    s += dust(catX, ph);
    s += cat(catX, ph, close > 0.8 ? (close - 0.8) / 0.2 : 0);
    s += mouse(mouseX, ph * 1.8, (i % 7) === 2 || (i % 7) === 3);
    // running head, scrawled once per page
    s += '<text x="34" y="46" font-family="Shantell Sans, Segoe Print, Bradley Hand, cursive" font-size="17" fill="' + SOFT +
         '" opacity="0.75" transform="rotate(-1.4 34 46)">the chase</text>';
    return '<g>' + s + '</g>';
  }

  /* ============ riffle it ============ */
  var art = document.getElementById("art"),
      inner = document.getElementById("pageInner"),
      sweep = document.getElementById("sweep"),
      folio = document.getElementById("folio"),
      stackL = document.getElementById("stackL"),
      stackR = document.getElementById("stackR"),
      groups = [], html = "", i;

  for(i = 0; i < FRAMES; i++){ html += frame(i); }
  art.innerHTML = html;
  groups = art.children;
  for(i = 0; i < groups.length; i++){ groups[i].setAttribute("display", i === 0 ? "inline" : "none"); }

  var slow = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches,
      MS = slow ? 330 : 82,           // ~12 pages a second when thumbed at speed
      HOLD = slow ? 700 : 430,        // a beat on the last page before the thumb re-grips
      RIGHT_MAX = window.innerWidth < 520 ? 34 : 52,
      cur = 0, acc = 0, last = 0;

  function show(n){
    groups[cur].setAttribute("display", "none");
    groups[n].setAttribute("display", "inline");
    cur = n;
    folio.textContent = String(n + 1);
    var p = n / (FRAMES - 1);
    stackL.style.width = (5 + p * (RIGHT_MAX - 7)).toFixed(1) + "px";
    stackR.style.width = (RIGHT_MAX - p * (RIGHT_MAX - 7)).toFixed(1) + "px";
    inner.animate([{ transform: "translateX(" + (slow ? 5 : 9) + "px)" }, { transform: "translateX(0)" }],
                  { duration: slow ? 220 : 90, easing: "ease-out" });
    sweep.animate([{ opacity: slow ? 0.25 : 0.5, transform: "translateX(-45%)" },
                   { opacity: 0, transform: "translateX(115%)" }],
                  { duration: slow ? 300 : 140, easing: "linear" });
  }

  function tick(now){
    if(!last) last = now;
    var dt = Math.min(now - last, 250);
    last = now;
    acc += dt;
    var wait = (cur === FRAMES - 1) ? HOLD : MS;
    if(acc >= wait){
      acc = 0;
      show((cur + 1) % FRAMES);
    }
    requestAnimationFrame(tick);
  }
  show(0);
  requestAnimationFrame(tick);

  window.addEventListener("resize", function(){
    RIGHT_MAX = window.innerWidth < 520 ? 34 : 52;
    var p = cur / (FRAMES - 1);
    stackL.style.width = (5 + p * (RIGHT_MAX - 7)).toFixed(1) + "px";
    stackR.style.width = (RIGHT_MAX - p * (RIGHT_MAX - 7)).toFixed(1) + "px";
  });
})();
</script>
</body>
</html>
