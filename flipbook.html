<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Chase Flipbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..700;1,300..700&display=swap" media="print" onload="this.media='all'">
<style>
/* ---- a sketchbook on a dark desk. one committed look, painted explicitly. ---- */
:root{
  --desk:#23241f;
  --desk-lit:#33342c;
  --paper:#efece2;
  --paper-edge:#ddd8c9;
  --paper-deep:#c9c3b0;
  --graphite:#2f2e2a;
  --graphite-mid:#55534c;
  --graphite-soft:#8d8b81;
  --caption:#807f73;
  --hand:"Shantell Sans","Segoe Print","Bradley Hand",cursive;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--desk);
  background-image:radial-gradient(120% 90% at 50% 42%, var(--desk-lit) 0%, var(--desk) 62%);
  color:var(--paper);
  font-family:var(--hand);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(14px,3vw,26px);
  padding:clamp(16px,4vw,40px);
  overflow-x:hidden;
}
.book{
  position:relative;
  width:min(94vw, 880px);
  transform:rotate(-1.1deg);
  filter:drop-shadow(0 26px 34px rgba(0,0,0,.55)) drop-shadow(0 3px 6px rgba(0,0,0,.4));
}
.leaf{ position:relative; display:flex; align-items:stretch; background:var(--paper); border-radius:2px 5px 5px 2px; }
.spine{
  flex:0 0 clamp(16px,2.4vw,24px); position:relative;
  background:linear-gradient(90deg, var(--paper-deep) 0%, var(--paper-edge) 46%, var(--paper) 100%);
  border-radius:2px 0 0 2px;
}
.spine::after{
  content:""; position:absolute; inset:7% 0 7% 42%; width:2px;
  background:repeating-linear-gradient(180deg, var(--graphite-mid) 0 9px, transparent 9px 19px);
  opacity:.5;
}
.stack{ flex:0 0 auto; background-repeat:repeat-x; }
.stack-left{
  width:6px;
  background-image:repeating-linear-gradient(90deg, var(--paper-deep) 0 1px, var(--paper) 1px 3px);
  box-shadow:inset -3px 0 5px -3px rgba(80,74,58,.5);
}
.stack-right{
  width:52px;
  background-image:repeating-linear-gradient(90deg, var(--paper) 0 2px, var(--paper-edge) 2px 3px);
  box-shadow:inset 5px 0 8px -5px rgba(80,74,58,.55);
  border-radius:0 4px 4px 0;
}
.page{ position:relative; flex:1 1 auto; min-width:0; aspect-ratio:720/480; overflow:hidden; background:var(--paper); }
.page-inner{ position:absolute; inset:0; will-change:transform }
.page svg.art{ display:block; width:100%; height:100% }
.grain{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:multiply; opacity:.5 }
.sweep{
  position:absolute; inset:0; pointer-events:none; opacity:0;
  background:linear-gradient(100deg, transparent 34%, rgba(96,88,66,.30) 48%, rgba(96,88,66,.06) 56%, transparent 66%);
}
.folio{
  position:absolute; right:2.6%; bottom:2.4%;
  font-family:var(--hand); font-size:clamp(11px,1.5vw,16px); font-weight:500;
  color:var(--graphite-soft); font-variant-numeric:tabular-nums; transform:rotate(1.6deg);
}
.book::after{
  content:""; position:absolute; left:1.2%; right:.4%; top:100%; height:11px;
  background:repeating-linear-gradient(180deg, var(--paper-edge) 0 1px, var(--paper-deep) 1px 2px);
  border-radius:0 0 4px 5px; transform:skewX(-38deg) translateX(3px); transform-origin:top left; opacity:.85;
}
.caption{
  margin:0; font-size:clamp(12px,1.6vw,15px); font-style:italic; font-weight:300;
  color:var(--caption); text-align:center; text-wrap:balance; max-width:38ch; line-height:1.5;
}
@media (max-width:520px){ .stack-right{width:34px} }
</style>
</head>
<body>

<div class="book">
  <div class="leaf">
    <div class="spine"></div>
    <div class="stack stack-left" id="stackL"></div>
    <div class="page">
      <div class="page-inner" id="pageInner">
        <svg class="art" id="art" viewBox="0 0 720 480" aria-label="A pencil-drawn short: a cat chases a mouse over rolling ground until the mouse escapes down a hole, while a car passes on a distant road."></svg>
        <div class="folio" id="folio">1</div>
      </div>
      <svg class="grain" aria-hidden="true">
        <filter id="grain-f"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
        <rect width="100%" height="100%" filter="url(#grain-f)" opacity="0.22"/>
      </svg>
      <div class="sweep" id="sweep"></div>
    </div>
    <div class="stack stack-right" id="stackR"></div>
  </div>
</div>

<p class="caption">Twenty seconds, two hundred and forty pages, thumbed end to end. The mouse knew where the hole was the whole time.</p>

<script>
(function(){
  "use strict";

  /* ============ page geometry ============ */
  var W = 720;
  var ROAD   = 236;          // the far road, well above the cat's ears
  var FRAMES = 240;          // 20 seconds at 12 pages a second

  var DARK  = "#2f2e2a";
  var MID   = "#55534c";
  var SOFT  = "#8d8b81";
  var FAINT = "#aca99d";
  var PAPER = "#efece2";

  /* ============ pencil primitives ============ */
  // deterministic per page, different every page -> the boiling line of a real flipbook
  var rnd = mk(1);
  function mk(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hash(n){ var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
  function f(n){ return Math.round(n * 10) / 10; }
  function wrap(v, m){ return ((v % m) + m) % m; }
  function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function smooth(u){ return u * u * (3 - 2 * u); }

  // linear-through-keyframes with an ease on each leg; the whole story is written in these
  function key(fr, pts){
    var i, a, b, u;
    if(fr <= pts[0][0]) return pts[0][1];
    for(i = 1; i < pts.length; i++){
      if(fr <= pts[i][0]){
        a = pts[i - 1]; b = pts[i];
        u = smooth((fr - a[0]) / (b[0] - a[0]));
        return a[1] + (b[1] - a[1]) * u;
      }
    }
    return pts[pts.length - 1][1];
  }

  function jit(pts, amp){
    var out = [], i;
    for(i = 0; i < pts.length; i++){
      out.push([pts[i][0] + (rnd() * 2 - 1) * amp, pts[i][1] + (rnd() * 2 - 1) * amp]);
    }
    return out;
  }

  // a hand draws through points, it doesn't hit them
  function toPath(pts, closed){
    var p = closed ? pts.concat([pts[0], pts[1]]) : pts, d, i, mx, my, n;
    if(p.length < 2) return "";
    d = closed ? "M" + f((p[0][0] + p[1][0]) / 2) + " " + f((p[0][1] + p[1][1]) / 2)
               : "M" + f(p[0][0]) + " " + f(p[0][1]);
    for(i = 1; i < p.length - 1; i++){
      mx = (p[i][0] + p[i + 1][0]) / 2; my = (p[i][1] + p[i + 1][1]) / 2;
      d += "Q" + f(p[i][0]) + " " + f(p[i][1]) + " " + f(mx) + " " + f(my);
    }
    if(closed){ d += "Z"; }
    else { n = p.length; d += "L" + f(p[n - 1][0]) + " " + f(p[n - 1][1]); }
    return d;
  }

  // two or three passes at slightly different jitter = graphite laid down by hand
  function ink(pts, o){
    o = o || {};
    var amp    = o.amp    === undefined ? 1.3  : o.amp,
        w      = o.w      === undefined ? 2.2  : o.w,
        passes = o.passes === undefined ? 2    : o.passes,
        alpha  = o.alpha  === undefined ? 0.92 : o.alpha,
        col    = o.col    || DARK,
        fill   = o.fill   || "none",
        closed = !!o.closed,
        s = "", k, ww, aa;
    for(k = 0; k < passes; k++){
      ww = (w * (k === 0 ? 1 : 0.68 - k * 0.12)).toFixed(2);
      aa = (alpha * (k === 0 ? 1 : 0.40 - k * 0.10)).toFixed(2);
      s += '<path d="' + toPath(jit(pts, amp), closed) + '" fill="' + (k === 0 ? fill : "none") +
           '" stroke="' + col + '" stroke-width="' + ww + '" stroke-opacity="' + aa +
           '" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    return s;
  }

  function blob(cx, cy, r, squash, amp, o){
    var pts = [], i, a, rr;
    for(i = 0; i < 9; i++){
      a = i / 9 * Math.PI * 2; rr = r * (0.94 + rnd() * 0.12);
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * squash]);
    }
    o = o || {}; o.closed = true; o.amp = amp;
    return ink(pts, o);
  }

  /* ============ the ground itself ============ */
  // rolling terrain in world coordinates -- this is what makes twenty seconds feel
  // like a journey rather than a treadmill
  function terrainY(wx){ return 402 - 30 * Math.sin(wx / 880) - 11 * Math.sin(wx / 310 + 1.1); }
  function slopeAt(wx){ return (terrainY(wx + 26) - terrainY(wx - 26)) / 52; }

  /* ============ how fast we are travelling, page by page ============ */
  // the camera rides with the cat, so this curve IS the pacing of the short
  function speedAt(fr){
    return key(fr, [[0, 13], [22, 13], [48, 50], [118, 52], [152, 29], [180, 64],
                    [210, 54], [218, 50], [228, 0], [FRAMES, 0]]);
  }
  var SCROLL = [], _a = 0, _i;
  for(_i = 0; _i < FRAMES; _i++){ SCROLL.push(_a); _a += speedAt(_i); }

  var MOUSE_X = 470;         // the mouse holds station; the world moves under it
  var DIVE    = 220;         // the page the mouse reaches its hole
  var HOLE_W  = SCROLL[DIVE] + MOUSE_X;

  // Pulled out of the page builder so we can ask where the cat was a few pages
  // back. Follow-through needs the history, not just the present: the tail is
  // the last thing to hear that the body changed speed.
  function catAt(fr){
    fr = fr < 0 ? 0 : fr > FRAMES - 1 ? FRAMES - 1 : fr;
    var x = key(fr, [[0, -260], [26, -170], [52, 60], [86, 150], [104, 270],
                     [118, 190], [152, 150], [176, 300], [192, 240], [214, 330]]), u;
    if(fr > 214){
      u = smooth(clamp01((fr - 214) / 14));
      x = 330 * (1 - u) + ((HOLE_W - SCROLL[fr]) - 134) * u;
    }
    return x;
  }
  // how fast he is actually crossing the ground on this page
  function worldVel(fr){ return speedAt(fr) + (catAt(fr) - catAt(fr - 1)); }

  /* ============ far distance ============ */
  function sun(){
    var cx = 622, cy = 74, s = "", i, a;
    s += blob(cx, cy, 26, 1, 1.7, { w: 1.7, col: FAINT, alpha: 0.9 });
    for(i = 0; i < 9; i++){
      a = i / 9 * Math.PI * 2;
      s += ink([[cx + Math.cos(a) * 33, cy + Math.sin(a) * 33],
                [cx + Math.cos(a) * (44 + (i % 2) * 5), cy + Math.sin(a) * (44 + (i % 2) * 5)]],
               { w: 1.4, amp: 1.1, passes: 1, col: FAINT, alpha: 0.75 });
    }
    return s;
  }

  function clouds(sc){
    var s = "", spacing = 290, off = wrap(sc, spacing), x, k, cy, r;
    for(x = -spacing - off; x < W + spacing; x += spacing){
      k = Math.round((x + sc) / spacing);
      cy = 62 + hash(k) * 54; r = 22 + hash(k + 9) * 16;
      s += ink([[x - r * 1.7, cy + r * 0.5], [x - r * 1.3, cy - r * 0.3], [x - r * 0.4, cy - r * 0.85],
                [x + r * 0.5, cy - r * 0.6], [x + r * 1.4, cy - r * 0.1], [x + r * 1.8, cy + r * 0.5]],
               { w: 1.5, amp: 1.5, passes: 1, col: FAINT, alpha: 0.8 });
    }
    return s;
  }

  function birds(sc, fr){
    var s = "", spacing = 430, off = wrap(sc, spacing), x, k, cy, sz, flap;
    for(x = -spacing - off; x < W + spacing; x += spacing){
      k = Math.round((x + sc) / spacing);
      cy = 92 + hash(k + 11) * 44; sz = 8 + hash(k + 13) * 4;
      flap = Math.sin(fr * 0.9 + k) * 3;
      s += ink([[x - sz, cy], [x, cy - sz * 0.55 - flap], [x + sz, cy]],
               { w: 1.4, amp: 0.9, passes: 1, col: SOFT, alpha: 0.85 });
      s += ink([[x + sz * 1.6, cy + 12], [x + sz * 2.6, cy + 12 - sz * 0.5 + flap], [x + sz * 3.6, cy + 12]],
               { w: 1.3, amp: 0.9, passes: 1, col: SOFT, alpha: 0.75 });
    }
    return s;
  }

  function hills(sc){
    var pts = [], x, y;
    for(x = -60; x <= W + 60; x += 36){
      y = 196 - 26 * Math.sin((x + sc) / 118) - 11 * Math.sin((x + sc) / 51 + 1.7);
      pts.push([x, y]);
    }
    return ink(pts, { w: 1.6, amp: 1.4, passes: 1, col: FAINT, alpha: 0.85 });
  }

  function road(sc){
    var s = "", spacing = 62, off = wrap(sc, spacing), x;
    s += ink([[-20, ROAD + 4], [W * 0.35, ROAD - 1], [W * 0.72, ROAD + 2], [W + 20, ROAD - 2]],
             { w: 1.5, amp: 1.2, passes: 1, col: FAINT, alpha: 0.75 });
    for(x = -off; x < W + spacing; x += spacing){
      s += ink([[x, ROAD - 5], [x + 20, ROAD - 6]], { w: 1.2, amp: 0.8, passes: 1, col: FAINT, alpha: 0.5 });
    }
    return s;
  }

  // traffic on the far road: a car comes past every seven seconds or so, and keeps
  // coming after the chase has ended
  function car(fr, sc){
    var x = 800 - wrap(fr * 8 + sc * 0.18, 1560), y = ROAD - 10, s = "";
    if(x < -140 || x > W + 140) return "";
    s += ink([[x - 28, y], [x - 24, y - 9], [x - 6, y - 11], [x + 8, y - 11],
              [x + 24, y - 7], [x + 28, y], [x + 20, y + 4], [x - 20, y + 4]],
             { w: 1.5, amp: 1.0, col: SOFT, alpha: 0.85, closed: true, fill: PAPER });
    s += ink([[x - 12, y - 11], [x - 8, y - 21], [x + 6, y - 21], [x + 13, y - 11]],
             { w: 1.4, amp: 0.9, col: SOFT, alpha: 0.8 });
    s += ink([[x - 1, y - 20], [x - 1, y - 11]], { w: 1.1, amp: 0.6, passes: 1, col: FAINT });
    s += blob(x - 15, y + 5, 4.5, 1, 0.9, { w: 1.4, col: SOFT, alpha: 0.85, passes: 1 });
    s += blob(x + 15, y + 5, 4.5, 1, 0.9, { w: 1.4, col: SOFT, alpha: 0.85, passes: 1 });
    s += ink([[x + 34, y - 8], [x + 52, y - 8]], { w: 1.1, amp: 0.9, passes: 1, col: FAINT, alpha: 0.55 });
    s += ink([[x + 36, y - 1], [x + 60, y - 1]], { w: 1.1, amp: 0.9, passes: 1, col: FAINT, alpha: 0.45 });
    return s;
  }

  function midground(sc){
    var s = "", spacing = 300, off = wrap(sc, spacing), x, k, base, h, i, fx;
    for(x = -spacing - off; x < W + spacing; x += spacing){
      k = Math.round((x + sc) / spacing);
      base = terrainY(x + sc) - 56 - hash(k + 3) * 16;
      if(hash(k) > 0.42){
        h = 44 + hash(k + 5) * 22;
        s += ink([[x, base], [x + 2, base - h * 0.6], [x - 1, base - h]], { w: 1.9, amp: 1.2, passes: 1, col: SOFT });
        s += blob(x, base - h - 10, 15 + hash(k + 7) * 6, 0.78, 2.3, { w: 1.5, col: SOFT, alpha: 0.8, fill: PAPER });
        s += ink([[x - 1, base - h * 0.72], [x - 15, base - h * 0.94]], { w: 1.4, amp: 1, passes: 1, col: SOFT });
      } else {
        for(i = 0; i < 4; i++){
          fx = x + i * 22;
          s += ink([[fx, base], [fx + 1, base - 26]], { w: 1.5, amp: 1, passes: 1, col: SOFT, alpha: 0.7 });
        }
        s += ink([[x - 4, base - 18], [x + 72, base - 20]], { w: 1.3, amp: 1.1, passes: 1, col: SOFT, alpha: 0.7 });
      }
    }
    return s;
  }

  /* ============ the ground we run on ============ */
  function ground(sc, speed){
    var s = "", pts = [], x, k, gx, gy, gh, spacing = 230, off;
    for(x = -50; x <= W + 50; x += 30){ pts.push([x, terrainY(x + sc)]); }
    s += ink(pts, { w: 2.4, amp: 1.2 });

    for(k = 0; k < 18; k++){                       // dirt
      gx = rnd() * (W + 30) - 15;
      gy = terrainY(gx + sc) + 6 + rnd() * 24;
      s += ink([[gx, gy], [gx + 5 + rnd() * 7, gy + 3]], { w: 1.3, amp: 0.6, passes: 1, col: SOFT, alpha: 0.4 });
    }
    // streaks: lines can fly past at any speed without strobing the way objects do
    for(k = 0; k < 9; k++){
      gx = wrap(-sc * 1.15 + k * 151, W + 320) - 160;
      gy = terrainY(gx + sc) + 10 + hash(k + 31) * 22;
      s += ink([[gx, gy], [gx + (26 + speed * 0.9) + hash(k + 41) * 40, gy]],
               { w: 1.3, amp: 0.6, passes: 1, col: SOFT, alpha: 0.2 + speed * 0.007 });
    }
    off = wrap(sc, spacing);
    for(x = -spacing - off; x < W + spacing; x += spacing){
      k = Math.round((x + sc) / spacing);
      gy = terrainY(x + sc); gh = 10 + hash(k) * 13;
      s += ink([[x - 5, gy + 2], [x - 2, gy - gh * 0.8]], { w: 1.5, amp: 0.9, passes: 1, col: MID });
      s += ink([[x, gy + 2], [x + 2, gy - gh]],           { w: 1.5, amp: 0.9, passes: 1, col: MID });
      s += ink([[x + 5, gy + 2], [x + 9, gy - gh * 0.7]], { w: 1.5, amp: 0.9, passes: 1, col: MID });
    }
    return s;
  }

  /* ============ the chase ============ */
  var FOOT = 402;            // ground level under whoever is being drawn

  function leg(hx, hy, th, reach, lift, kneeLean, col, wide, bias){
    var fx = hx + (bias || 0) + Math.cos(th) * reach,
        fy = FOOT - Math.max(0, Math.sin(th)) * lift,
        mx = (hx + fx) / 2 + kneeLean, my = (hy + fy) / 2 + 3;
    return ink([[hx, hy], [mx, my], [fx, fy]], { w: wide, amp: 1.0, col: col }) +
           ink([[fx - 3.5, fy], [fx + 4, fy + 0.5]], { w: wide + 0.4, amp: 0.6, passes: 1, col: col });
  }

  function cat(x, ph, o){
    o = o || {};
    var reach = o.reach || 0, skid = o.skid || 0, still = o.still || 0,
        drag  = o.drag || 0,                       // how hard he is decelerating
        live  = 1 - still,
        // squash at the bottom of the bob: he compresses when the feet land,
        // and widens as he flattens so the volume stays put
        squash = live * Math.max(0, -Math.sin(ph * Math.PI * 4)) * (1 - reach),
        sy    = 1 - squash * 0.13,
        sx    = 1 + squash * 0.07,
        bob   = Math.sin(ph * Math.PI * 4) * 3.6 * (1 - reach * 0.6) * live,
        by    = FOOT - 58 + bob + reach * 7 + skid * 5,
        tw    = Math.sin(ph * Math.PI * 2 + 1.2) * live,
        th    = still ? 1.15 : ph * Math.PI * 2,
        lift  = (1 - skid) * live,
        open  = reach > 0.4 || (live && Math.sin(ph * Math.PI * 2) > 0.55),
        fwd   = skid * 26 + reach * 24,
        s = "", hx = x + 64 + reach * 10, hy = by - 20 - reach * 3 + still * 12, i, a,
        B = function(px, py){ return [x + px * sx, by + py * sy]; };

    // The tail is the far end of the drag hierarchy, so it hears about a change
    // of speed last: when he brakes, it keeps going forward and only then settles.
    s += ink([[x - 60, by - 2],
              [x - 86 + drag * 26, by - 16 - tw * 10 - drag * 6],
              [x - 108 + drag * 62, by - 34 - tw * 16 - drag * 22 - still * 14],
              [x - 114 + drag * 92, by - 56 - tw * 10 - drag * 34 - still * 30]],
             { w: 2.6, amp: 1.4 });
    s += leg(x - 36, by + 12, th + 0.35 * Math.PI, 11, 13 * lift, -6, MID, 2.0, -8 - skid * 4);
    s += leg(x + 26, by + 13, th + 1.25 * Math.PI, 11, 12 * lift,  6, MID, 2.0, 8 + fwd * 0.6);

    s += ink([B(-62, 2), B(-56, -18), B(-30, -27), B(6, -29),
              B(34, -23), B(48, -9), B(46, 10), B(16, 19),
              B(-20, 21), B(-50, 16)],
             { w: 2.5, amp: 0.9, closed: true, fill: PAPER });
    for(i = 0; i < 3; i++){
      a = x - 22 + i * 19;
      s += ink([[a, by - 26], [a + 5, by - 16]], { w: 1.8, amp: 0.9, passes: 1, col: MID });
    }
    s += leg(x - 44, by + 11, th,           13, 15 * lift, -7, DARK, 2.5, -10 - skid * 6);
    s += leg(x + 34, by + 12, th + Math.PI, 13, 14 * lift,  7, DARK, 2.5, 10 + fwd);

    s += blob(hx, hy, 21, 0.95, 0.9, { w: 2.4, fill: PAPER });
    s += ink([[hx - 16, hy - 12], [hx - 22, hy - 30], [hx - 2, hy - 20]], { w: 2.1, amp: 1.2, closed: true, fill: PAPER });
    s += ink([[hx + 4, hy - 20], [hx + 6, hy - 34], [hx + 18, hy - 15]], { w: 2.1, amp: 1.2, closed: true, fill: PAPER });
    s += blob(hx + 7, hy - 5, 5.2, 1.05, 0.8, { w: 1.9, passes: 1 });
    s += blob(hx + 8.5, hy - 4 + still * 2, 2.1, 1, 0.5, { w: 2.4, passes: 1, fill: DARK });
    s += blob(hx + 17, hy + 4, 3.2, 0.8, 0.6, { w: 2, passes: 1, fill: DARK });
    if(open){ s += ink([[hx + 12, hy + 9], [hx + 17, hy + 16], [hx + 22, hy + 8]], { w: 1.9, amp: 1, closed: true }); }
    else    { s += ink([[hx + 11, hy + 9], [hx + 16, hy + 12], [hx + 21, hy + 8]], { w: 1.8, amp: 1, passes: 1 }); }
    for(i = 0; i < 3; i++){
      s += ink([[hx + 16, hy + 3], [hx + 38, hy - 4 + i * 8]], { w: 1.2, amp: 1.1, passes: 1, col: MID, alpha: 0.8 });
    }
    return s;
  }

  function mouse(x, ph, glance, dive){
    dive = dive || 0;
    var bob = Math.sin(ph * Math.PI * 4) * 2.2 * (1 - dive),
        // a dive is a fall, so it accelerates -- a straight slide down reads mechanical
        by  = FOOT - 27 + bob + dive * dive * 30,
        tw  = Math.sin(ph * Math.PI * 2 + 0.6),
        s = "", i, lx;

    s += ink([[x - 22, by - 1], [x - 42, by - 6 - tw * 6], [x - 62, by + 2], [x - 74, by - 6 - tw * 8]],
             { w: 1.7, amp: 1.2, col: MID });
    for(i = 0; i < 4; i++){
      lx = x - 15 + i * 11;
      s += ink([[lx, by + 6], [lx + Math.cos(ph * Math.PI * 2 + i * 1.6) * 6, FOOT + dive * 10]],
               { w: 1.5, amp: 1.1, passes: 1, col: (i % 2) ? MID : DARK });
    }
    s += ink([[x - 24, by + 2], [x - 19, by - 9], [x - 3, by - 13], [x + 13, by - 11],
              [x + 25, by - 3], [x + 20, by + 8], [x - 6, by + 11], [x - 20, by + 9]],
             { w: 2.1, amp: 0.8, closed: true, fill: PAPER });
    s += blob(x + 4, by - 14, 7, 0.95, 1.1, { w: 1.8, fill: PAPER, passes: 1 });
    s += blob(x + 17, by - 5, 1.9, 1, 0.5, { w: 2.1, passes: 1, fill: DARK });
    s += ink([[x + 24, by - 2], [x + 31, by + 1]], { w: 1.6, amp: 0.8, passes: 1 });
    for(i = 0; i < 2; i++){
      s += ink([[x + 27, by], [x + 40, by - 4 + i * 7]], { w: 1.1, amp: 1, passes: 1, col: MID, alpha: 0.75 });
    }
    if(glance){
      s += ink([[x + 8, by - 32], [x + 10, by - 24]], { w: 2.2, amp: 0.8, passes: 1 });
      s += ink([[x + 10.5, by - 20], [x + 11, by - 19]], { w: 2.6, amp: 0.4, passes: 1 });
    }
    return s;
  }

  // the rock the mouse lives under. drawn after the mouse, so it swallows him.
  function hole(x, sc){
    var gy = terrainY(x + sc), s = "";
    s += ink([[x - 46, gy + 2], [x - 40, gy - 26], [x - 18, gy - 44], [x + 14, gy - 46],
              [x + 40, gy - 30], [x + 48, gy + 2]],
             { w: 2.3, amp: 1.3, col: MID, fill: PAPER });
    s += ink([[x - 30, gy - 14], [x - 12, gy - 24]], { w: 1.3, amp: 0.9, passes: 1, col: SOFT, alpha: 0.7 });
    s += ink([[x + 6, gy - 30], [x + 22, gy - 22]],  { w: 1.3, amp: 0.9, passes: 1, col: SOFT, alpha: 0.7 });
    s += ink([[x - 20, gy + 2], [x - 16, gy - 18], [x + 2, gy - 24], [x + 16, gy - 16], [x + 19, gy + 2]],
             { w: 2.0, amp: 1.0, col: DARK, fill: DARK, closed: true });
    return s;
  }

  function speedLines(x, y, n, len, spread, alpha){
    var s = "", i;
    for(i = 0; i < n; i++){
      s += ink([[x, y + i * spread], [x - len - rnd() * 14, y + i * spread + (rnd() * 4 - 2)]],
               { w: 1.4, amp: 1.1, passes: 1, col: SOFT, alpha: alpha });
    }
    return s;
  }

  function dust(x, ph, amount){
    var s = "", i, d, r;
    for(i = 0; i < 4; i++){
      d = ((ph * 2 + i / 4) % 1);
      r = (3.5 + d * 11) * amount;
      if(r < 0.6) continue;
      s += blob(x - 62 - d * 74, FOOT - 10 - d * 26, r, 0.75, 1.8,
                { w: 1.2, passes: 1, col: FAINT, alpha: 0.8 * (1 - d) * amount });
    }
    return s;
  }

  /* ============ one page of the book ============ */
  function frame(fr){
    rnd = mk(1013 + fr * 977);
    var sc    = SCROLL[fr],
        speed = speedAt(fr),
        ph    = sc / 210,                                   // stride tied to distance, not time,
                                                            // so he takes shorter steps uphill
        hxp   = HOLE_W - sc,                                // the hole, arriving from the right
        catX  = catAt(fr),
        drag  = clamp01((worldVel(fr - 3) - worldVel(fr)) / 26),
        skid  = key(fr, [[210, 0], [222, 1], [236, 1], [240, 1]]),
        still = fr >= 232 ? clamp01((fr - 232) / 4) : 0,
        reach = key(fr, [[92, 0], [104, 1], [116, 0], [166, 0], [176, 1], [190, 0],
                         [206, 0], [216, 1], [222, 0]]),
        dive  = fr >= 210 ? clamp01((fr - 210) / 10) : 0,
        u, gy, ang, s = "";

    s += sun();
    s += clouds(sc * 0.04);
    s += birds(sc * 0.08, fr);
    s += hills(sc * 0.12);
    s += road(sc * 0.18);
    s += car(fr, sc);
    s += midground(sc * 0.45);
    s += ground(sc, speed);

    if(speed > 20){
      s += speedLines(catX - 112, terrainY(catX + sc) - 84, 4, 26 + speed * 0.7, 15, 0.2 + speed * 0.008);
      if(fr < DIVE) s += speedLines(MOUSE_X - 40, terrainY(MOUSE_X + sc) - 34, 3, 18 + speed * 0.4, 11, 0.2 + speed * 0.006);
    }

    // the mouse, standing on its own patch of ground
    if(fr <= DIVE + 1){
      // as he dives he tracks the mouth of the hole, so the rock drawn over him
      // in a moment swallows him rather than passing behind
      var mx = MOUSE_X + (hxp - MOUSE_X) * smooth(dive);
      FOOT = terrainY(mx + sc);
      ang = Math.atan(slopeAt(mx + sc)) * 57.3;
      s += '<g transform="rotate(' + f(ang) + ' ' + f(mx) + ' ' + f(FOOT) + ')">' +
           mouse(mx, ph * 1.35, fr > 40 && (fr % 23) < 3, dive) + '</g>';
    }

    // the rock is drawn over the mouse, so he vanishes into it
    if(hxp > -140 && hxp < W + 160) s += hole(hxp, sc);

    // the cat, on his
    FOOT = terrainY(catX + sc);
    gy = FOOT;
    ang = Math.atan(slopeAt(catX + sc)) * 57.3 - skid * 7;
    s += dust(catX, ph, Math.min(1, speed / 40) + skid * 1.4);
    s += '<g transform="rotate(' + f(ang) + ' ' + f(catX) + ' ' + f(gy) + ')">' +
         cat(catX, ph, { reach: reach, skid: skid, still: still, drag: drag }) + '</g>';
    FOOT = 402;

    s += '<text x="34" y="46" font-family="Shantell Sans, Segoe Print, Bradley Hand, cursive" font-size="17" fill="' +
         SOFT + '" opacity="0.75" transform="rotate(-1.4 34 46)">the chase</text>';
    return s;
  }

  /* ============ riffle it ============ */
  var art = document.getElementById("art"),
      inner = document.getElementById("pageInner"),
      sweep = document.getElementById("sweep"),
      folio = document.getElementById("folio"),
      stackL = document.getElementById("stackL"),
      stackR = document.getElementById("stackR"),
      cache = new Array(FRAMES);

  function page(n){ if(cache[n] === undefined){ cache[n] = frame(n); } return cache[n]; }

  // draw the first second now so it starts instantly, then fill the rest in the
  // background -- 240 pages is too many to build before the first one appears
  var i2;
  for(i2 = 0; i2 < 6; i2++){ page(i2); }

  var slow = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches,
      MS = slow ? 250 : 1000 / 12,   // 12 pages a second -> 240 pages is exactly 20.000s
      HOLD = slow ? 900 : 520,       // a beat on the last page before the thumb re-grips
      RIGHT_MAX = window.innerWidth < 520 ? 34 : 52,
      cur = -1, t0 = 0;

  function show(n){
    art.innerHTML = page(n);
    cur = n;
    page((n + 1) % FRAMES);                          // stay one page ahead of the thumb
    folio.textContent = String(n + 1);
    var p = n / (FRAMES - 1);
    stackL.style.width = (5 + p * (RIGHT_MAX - 7)).toFixed(1) + "px";
    stackR.style.width = (RIGHT_MAX - p * (RIGHT_MAX - 7)).toFixed(1) + "px";
    inner.animate([{ transform: "translateX(" + (slow ? 5 : 9) + "px)" }, { transform: "translateX(0)" }],
                  { duration: slow ? 200 : 90, easing: "ease-out" });
    sweep.animate([{ opacity: slow ? 0.22 : 0.45, transform: "translateX(-45%)" },
                   { opacity: 0, transform: "translateX(115%)" }],
                  { duration: slow ? 280 : 140, easing: "linear" });
  }

  // Which page SHOULD be showing at this instant. Advancing by a counter made the
  // rate a multiple of the display refresh (22.9s instead of 20); reading the clock
  // keeps the running time honest on any monitor.
  function tick(now){
    if(!t0) t0 = now;
    var cycle = FRAMES * MS + HOLD,
        m = (now - t0) % cycle,
        n = m >= FRAMES * MS ? FRAMES - 1 : Math.floor(m / MS);
    if(n !== cur) show(n);
    requestAnimationFrame(tick);
  }
  show(0);
  requestAnimationFrame(tick);

  window.addEventListener("resize", function(){
    RIGHT_MAX = window.innerWidth < 520 ? 34 : 52;
    var p = cur / (FRAMES - 1);
    stackL.style.width = (5 + p * (RIGHT_MAX - 7)).toFixed(1) + "px";
    stackR.style.width = (RIGHT_MAX - p * (RIGHT_MAX - 7)).toFixed(1) + "px";
  });
})();
</script>
</body>
</html>
